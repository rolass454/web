<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lluvia de Amor</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      font-family: 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
      position: relative;
      z-index: 1;
    }
    
    .heart-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      height: 320px;
      z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 0 12px #ff69b4);
    }

    .heart {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      clip-path: path('M175,50 C125,-20 40,10 40,90 C40,150 90,210 175,280 C260,210 310,150 310,90 C310,10 225,-20 175,50 Z');
      border: 3px solid #ff69b4;
      border-radius: 50% 50% 0 0;
      box-shadow: 0 0 25px rgba(255,105,180,0.8);
    }

    .heart-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4;
      font-family: 'Arial', cursive;
    }

    .heart-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,105,180,0.3) 0%, rgba(255,105,180,0) 70%);
      border-radius: 50%;
      top: 0;
      left: 0;
    }

    .love-image {
      position: fixed;
      top: calc(50% + 180px);
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: auto;
      border-radius: 10px;
      border: 2px solid #ff69b4;
      box-shadow: 0 0 15px rgba(255,105,180,0.7);
      z-index: 2;
    }

    .heart-button {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #ff69b4;
      border: none;
      color: white;
      font-size: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 3;
      box-shadow: 0 0 15px rgba(255,105,180,0.7);
      transition: transform 0.2s, box-shadow 0.3s;
      animation: pulse 2s infinite;
    }

    .heart-button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255,105,180,1);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="heart-container">
    <div class="heart-glow"></div>
    <div class="heart"></div>
    <div class="heart-text">Aunque digas que ya no me amas, yo sigo aquí. No me rindo por un momento duro. Te amo y todavía creo en nosotros</div>
  </div>

  <canvas id="canvas"></canvas>

  <!-- Imagen debajo del corazón -->
  <img src="ok.png" alt="" class="love-image">

  <!-- Botón de reproducción en forma de corazón (ahora en esquina superior derecha) -->
  <button id="playButton" class="heart-button">&#10084;</button>

  <!-- Reproductor de audio -->
  <audio id="loveSong" src="hol.mp3"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const phrase = "TE AMO ";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function isInsideHeart(x, y) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const scaledX = (x - centerX) * (350 / 300);
      const scaledY = (y - centerY) * (320 / 300);
      return Math.pow(Math.pow(scaledX, 2) + Math.pow(scaledY - 50, 2) - 10000, 3) -
             Math.pow(scaledX, 2) * Math.pow(scaledY - 50, 3) < 0;
    }

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff69b4";
      ctx.font = fontSize + "px Arial";

      for (let i = 0; i < drops.length; i++) {
        const text = phrase;
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        if (!isInsideHeart(x, y)) {
          ctx.fillText(text, x, y);
        }

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(draw, 100);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Botón para reproducir/pausar la canción
    document.getElementById('playButton').addEventListener('click', function () {
      const audio = document.getElementById('loveSong');
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
  </script>
</body>
</html>
